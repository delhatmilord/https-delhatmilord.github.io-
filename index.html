<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="milord.pikobuy — Alle meine Links an einem Ort" />
  <title>✨️MILORDS PAGE ✨️</title>
  <style>
    :root{
      --card-bg:rgba(0,0,0,0.30);
      --card-border:rgba(255,255,255,.10);
      --text-muted:#cfcfcf;
      --accent:#4da6ff;
      --max-width:520px;
      --radius:16px;
      --gap:14px;
      --bio-color: #ffffff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
      color:var(--bio-color);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px 15px;
      position:relative;
      overflow:hidden;
      background-color:#000;
      /* Galaxie-Hintergrund; ersetze bei Bedarf durch eigenes Bild */
      background-image:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=2000&q=80');
      background-size:cover;
      background-position:center center;
    }

    /* Sonnen-Glow oben rechts */
    .sun {
      position:fixed;
      top:28px;
      right:28px;
      width:140px;
      height:140px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,200,1) 0%, rgba(255,220,120,0.9) 12%, rgba(255,160,40,0.6) 28%, rgba(255,120,20,0.12) 45%, transparent 65%);
      filter: blur(8px) saturate(1.1);
      box-shadow: 0 0 60px rgba(255,200,120,0.15);
      z-index:0;
      pointer-events:none;
    }

    .space-overlay{
      position:fixed;
      inset:0;
      z-index:0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(50,80,120,0.08), transparent 15%),
        radial-gradient(ellipse at 80% 20%, rgba(120,90,50,0.04), transparent 20%);
      pointer-events:none;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
      text-align:center;
      position:relative;
      z-index:2;
      padding:28px;
      border-radius:18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.20));
      border:1px solid var(--card-border);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .profile-image{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid rgba(255,255,255,0.12);
      box-shadow:0 8px 30px rgba(0,0,0,.6);
      display:block;
      margin:0 auto;
      background:#222;
    }

    .name{margin-top:12px;font-size:26px;font-weight:800;display:flex;gap:10px;align-items:center;justify-content:center;color:#fff}
    /* Grosser, weisser Bio-Text in Großbuchstaben */
    .bio{
      margin-top:12px;
      color:var(--bio-color);
      font-size:18px;
      font-weight:800;
      letter-spacing:0.06em;
      text-transform:uppercase;
    }
    .bio.small{font-size:13px;font-weight:600;text-transform:none;color:var(--text-muted);margin-top:8px}

    .links{display:flex;flex-direction:column;gap:14px;margin-top:18px}
    .link{display:flex;align-items:center;justify-content:center;min-height:62px;padding:15px 20px;color:inherit;text-decoration:none;font-size:17px;font-weight:700;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);backdrop-filter:blur(6px)}
    .link:hover{transform:translateY(-3px);background:rgba(255,255,255,.04)}
    footer{margin-top:20px;color:rgba(255,255,255,0.75);font-size:12px}

    @media(max-width:500px){
      body{padding:20px 12px}
      .name{font-size:22px}
      .bio{font-size:16px}
      .link{font-size:15px}
    }
  </style>
</head>
<body>
  <!-- Sonnen-Glow -->
  <div class="sun" aria-hidden="true"></div>
  <div class="space-overlay" aria-hidden="true"></div>

  <div class="container" role="main">
    <header class="profile" role="banner">
      <!-- Profilbild: echtes Foto (Platzhalter von Unsplash). Ersetze durch eigenes Bild, wenn vorhanden. -->
      <img
        class="profile-image"
        src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=500&q=80"
        alt="milord — Profilbild"
        loading="lazy"
        width="120"
        height="120"
        onerror="this.onerror=null;this.src='https://via.placeholder.com/300?text=milord';"
      >
      <div class="name">milord.pikobuy <span style="color:var(--accent);margin-left:8px">✓</span></div>

      <!-- Geänderter Haupttext -->
      <p class="bio">✨️MILORDS PAGE ✨️</p>
      <p class="bio small">🔗 Alle meine Links an einem Ort</p>
    </header>

    <nav class="links" aria-label="Links">
      <a class="link" href="https://m.pikobuy.com/pages/login/register?invitedCode=ESBKQU" target="_blank" rel="noopener noreferrer">Pikobuy 40%</a>
      <a class="link" href="https://www.tiktok.com/@milord.74" target="_blank" rel="noopener noreferrer">Mein TikTok</a>
    </nav>

    <footer role="contentinfo"><strong>milord.pikobuy</strong> · All your links in one place</footer>
  </div>
</body>
</html>
